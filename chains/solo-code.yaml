# solo-code — the simplest possible chain: ONE stage.
#
# One model, full tools, one shot at the whole item, judged by the repo's own gate.
# It exercises the entire kernel (config → prompt → CLI → telemetry → record →
# gate) with no loop to hide behind, and it doubles as the null hypothesis: if
# this delivers as often as a multi-stage chain, the extra stages are overhead.

name: solo-code

# SEEDS are the artifacts the chain starts with — everything a stage can reference
# before any stage has run. A leading @ reads the value from a file, relative to
# this chain file, so a spec lives on disk instead of being pasted into config.
seeds:
  spec: "@specs/todo-toggle-done.md"
  invariants: "@specs/invariants-fc-todo.md"
  coding: "@specs/coding.md"

# Folded into every stage that does not override them. Keeping model out of
# defaults is deliberate: which model runs a stage is the single most consequential
# line in an experiment, so it is stated per stage where it cannot be missed.
defaults:
  effort: high
  timeoutMs: 1800000 # 30 min — this stage builds an entire item in one call

stages:
  - id: code
    prompt: ../prompts/solo-code.md
    produces: notes # its output is available downstream as {{notes}}
    parse: text
    model: mai-code-1.1-flash # the cheap builder — the whole point of the null test
    tools: true # it must be able to read and write the repo

# The chain's own definition of done, run once over the assembled result.
# NOTE this repo has no `pnpm gate` script; these are the three real ones.
gate: pnpm -s typecheck && pnpm -s lint && pnpm -s test
