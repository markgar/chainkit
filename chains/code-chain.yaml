# code-chain — the classic five-stage process, expressed entirely as config.
#
# This is code-chain's shape (plan → plan review → code → code review → fix), and
# it exists as the PROOF that the schema generalised: nothing in the kernel knows
# what a "review" or a "fix" is. A review is just a stage whose prompt asks for a
# verdict and whose output parses as JSON; a fix is just a stage whose prompt reads
# that verdict. If expressing a process needs a kernel change, the schema is wrong.
#
# One deliberate difference from code-chain itself: the review/fix loop is hoisted
# OUT of the builder. code-chain's builder reviews and repairs itself inside one
# sub-agent, so the rounds are invisible and arrive as a single bill. Here each
# round is a separate call with its own telemetry, which is what makes "is this
# converging or thrashing?" answerable.
#
# THE MODELS ARE code-chain's, NOT flash-chain's, and that is the point: this chain
# only proves the schema generalised if it reproduces the process it is named after.
# Roles and their models are fixed here exactly as code-chain fixes them --
# PLANNER claude-opus-4.8 (medium), CRITIC + REVIEWER claude-sonnet-5 (high),
# BUILDER gpt-5.3-codex. Swapping the builder for a cheap model is a different
# experiment with a different name; it lives in solo-code / fanout-code, where the
# cost comparison is the whole question. Mixing the two produces a run that answers
# neither.

name: code-chain

seeds:
  spec: "@specs/todo-toggle-done.md"
  invariants: "@specs/invariants-fc-todo.md"
  coding: "@specs/coding.md"

defaults:
  effort: high
  timeoutMs: 1800000

stages:
  # ---- design -------------------------------------------------------------
  - id: plan
    prompt: ../prompts/cc-plan.md
    produces: plan
    parse: text
    model: claude-opus-4.8 # code-chain's PLANNER: chunking by RISK is the judgment call
    effort: medium # code-chain plans at medium, not high -- matched deliberately
    tools: true # it must read the real files before partitioning them

  - id: plan-review
    prompt: ../prompts/cc-plan-review.md
    produces: planVerdict
    parse: json
    model: claude-sonnet-5 # DECORRELATED from the planner on purpose --
    tools: false # a critic from the same family shares its blind spots

  # ---- build --------------------------------------------------------------
  - id: code
    prompt: ../prompts/cc-code.md
    produces: buildNotes
    parse: text
    model: gpt-5.3-codex # code-chain's BUILDER, a different family from the reviewer
    tools: true

  # ---- verify + repair (the loop) ----------------------------------------
  - id: review
    prompt: ../prompts/cc-review.md
    produces: verdict
    parse: json # `pass` is what breaks the loop, so it must parse
    model: claude-sonnet-5 # code-chain's REVIEWER: re-derives from spec, not from the diff
    tools: true # it runs the tests itself rather than trusting the builder's word

  - id: fix
    prompt: ../prompts/cc-fix.md
    produces: fixNotes
    parse: text
    model: gpt-5.3-codex # the builder repairs its own work, as in code-chain
    tools: true
    resume:
      true # CONTINUE the builder's own session: it keeps the context it
      # already paid for, and the re-sent input is served as cache-read

loop:
  stages: [review, fix]
  until: verdict.pass
  max: 3 # bounded: a review that never passes must stop costing money

gate: pnpm -s typecheck && pnpm -s lint && pnpm -s test
