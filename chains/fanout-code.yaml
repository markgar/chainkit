# fanout-code — plan → plan review → (code → review → fix) once per chunk.
#
# The five-stage process code-chain runs, but with the build fanned out: the planner
# partitions the spec into chunks, and the build/review/fix triple runs once per
# chunk with its own bounded loop and its own objective gate.
#
# What this chain is actually testing is whether the fan-out is CONFIG. The kernel
# does not know what a "chunk" is -- `over` names an array, `as` binds an element,
# and the prompts decide the rest. If expressing this needed a kernel change, the
# schema was wrong.
#
# Two decisions worth naming because they are the ones that make a run measurable:
#
#   The GATE IS PER CHUNK. `{{chunk.acceptance}}` is the chunk's own grader command,
#   so each element gets an objective pass/fail at the moment it is built, and a
#   failure is attributed to the chunk that caused it. A single gate at the end can
#   only say "the package is red", about all chunks at once, after paying for all of
#   them.
#
#   The PLAN REVIEW HAS TEETH. plan and plan-review sit in the outer loop with
#   `until: planVerdict.pass`, so a blocking critique forces a re-plan rather than
#   being advice nobody reads. `planVerdict` is SEEDED with a sentinel because a
#   missing placeholder is a hard error by design -- on the first pass the planner
#   renders "no prior review", on the second it renders the real critique.

name: fanout-code

seeds:
  spec: "@../fixtures/scaffold-calc/spec.md"
  planVerdict: "(none — this is the first attempt at a plan)"

defaults:
  effort: high
  timeoutMs: 1800000

stages:
  # ---- design (outer loop) ------------------------------------------------
  - id: plan
    prompt: ../prompts/fan-plan.md
    produces: plan
    parse: json
    expects:
      chunks: array # the fan-out iterates this; a plan without it cannot drive one
    model: gpt-5.6-sol # partitioning by risk is the judgment call
    tools: true # it must read the real grader before partitioning

  - id: plan-review
    prompt: ../prompts/fan-plan-review.md
    produces: planVerdict
    parse: json
    expects:
      pass: boolean # this field breaks the outer loop, so it must exist
    model: claude-opus-4.8 # DECORRELATED from the planner on purpose
    tools: false

  # ---- build (once per chunk) --------------------------------------------
  - id: code
    prompt: ../prompts/fan-code.md
    produces: buildNotes
    parse: text
    model: mai-code-1.1-flash # cheap builder: transcribes a blueprint it did not invent
    tools: true

  - id: review
    prompt: ../prompts/fan-review.md
    produces: verdict
    parse: json
    expects:
      pass: boolean
    model: gpt-5.6-sol
    tools: true # it runs the chunk's tests itself rather than trusting the builder

  - id: fix
    prompt: ../prompts/fan-fix.md
    produces: fixNotes
    parse: text
    model: mai-code-1.1-flash
    tools: true
    resume: true # continue the builder's own session for THIS chunk

loop:
  stages: [plan, plan-review]
  until: planVerdict.pass
  max:
    2 # one re-plan. A planner that cannot satisfy its reviewer twice is
    # not going to on the third try, and the chunks are what gets billed.

foreach:
  over: plan.chunks
  as: chunk
  stages: [code, review, fix]
  expects:
    id: string
    files: array
    acceptance:
      string # rendered into the gate below; absent would mean an EMPTY
      # command, and an empty shell command passes
    blueprint: string
  loop:
    stages: [review, fix]
    until: verdict.pass
    max: 3
  gate: "{{chunk.acceptance}}"
  max: 8 # refuse an oversized plan rather than truncating it

# The chain gate runs the WHOLE grader. Every chunk already passed its own suite, so
# this exists to catch what per-chunk grading structurally cannot: modules that are
# each correct and wired together wrong.
gate: bash -o pipefail -c "node --test acceptance/*.test.js"
